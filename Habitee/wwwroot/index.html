<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habitee</title>
    <base href="/" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="Habitee.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        html, body {
            min-height: 100%;
        }

        body {
            margin: 0;
        }

        .boot-splash {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #f5f7fb;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
        }

        .boot-card {
            width: min(420px, 100%);
            padding: 2rem 1.75rem;
            border-radius: 18px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #d7deea;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .boot-mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            position: relative;
        }

        .boot-spinner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid #d7deea;
            border-top-color: #2563eb;
            animation: bootSpin 0.9s linear infinite;
        }

        .boot-title {
            margin: 0 0 0.4rem;
            font-size: 1.75rem;
            font-weight: 700;
            color: #111827;
        }

        .boot-copy {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #6b7280;
        }

        @keyframes bootSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot-splash">
            <div class="boot-card">
                <div class="boot-mark" aria-hidden="true">
                    <div class="boot-spinner"></div>
                </div>
                <h1 class="boot-title">Habitee</h1>
                <p class="boot-copy">Loading your habit space...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/indexeddb.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
    <script src="js/firebase-messaging.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habitee</title>
    <base href="/" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600&family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="Habitee.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        html, body {
            min-height: 100%;
        }

        body {
            margin: 0;
        }

        .boot-splash {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(circle at top, rgba(59, 130, 246, 0.20), transparent 38%),
                linear-gradient(180deg, #f6fbff 0%, #eef7ff 48%, #f9fcff 100%);
            color: #16314f;
            font-family: 'Nunito', 'Inter', sans-serif;
        }

        .boot-card {
            width: min(420px, 100%);
            padding: 2rem 1.75rem;
            border-radius: 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow:
                0 24px 60px rgba(30, 64, 175, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .boot-mark {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.2rem;
            position: relative;
        }

        .boot-ring,
        .boot-core {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .boot-ring {
            border: 2px solid rgba(59, 130, 246, 0.14);
        }

        .boot-ring.outer {
            border-top-color: #2563eb;
            animation: bootSpin 1.05s linear infinite;
        }

        .boot-ring.inner {
            inset: 12px;
            border-bottom-color: #60a5fa;
            animation: bootSpinReverse 1.55s linear infinite;
        }

        .boot-core {
            inset: 28px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.55), transparent 52%),
                linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            border: 1px solid rgba(147, 197, 253, 0.78);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.15);
            color: #2563eb;
        }

        .boot-core svg {
            width: 34px;
            height: 34px;
        }

        .boot-title {
            margin: 0 0 0.4rem;
            font-family: 'Comfortaa', cursive;
            font-size: 2rem;
            font-weight: 700;
            color: #1d4ed8;
        }

        .boot-copy {
            margin: 0;
            font-size: 0.98rem;
            line-height: 1.5;
            color: #4b6486;
        }

        .boot-dots {
            display: inline-flex;
            gap: 0.45rem;
            margin-top: 1rem;
        }

        .boot-dots span {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 999px;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            animation: bootPulse 1.1s ease-in-out infinite;
        }

        .boot-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .boot-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bootSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes bootSpinReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes bootPulse {
            0%, 100% { transform: translateY(0) scale(0.88); opacity: 0.45; }
            50% { transform: translateY(-2px) scale(1); opacity: 1; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot-splash">
            <div class="boot-card">
                <div class="boot-mark" aria-hidden="true">
                    <div class="boot-ring outer"></div>
                    <div class="boot-ring inner"></div>
                    <div class="boot-core">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="8"></circle>
                            <path d="M12 7v5l3 3"></path>
                        </svg>
                    </div>
                </div>
                <h1 class="boot-title">Habitee</h1>
                <p class="boot-copy">Loading your habit space...</p>
                <div class="boot-dots" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/indexeddb.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
    <script src="js/firebase-messaging.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
